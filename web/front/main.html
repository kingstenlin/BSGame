<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BS — table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <h1>BS — table</h1>
    <span id="statusLine" class="status-line"><span class="status-dot" id="statusDot"></span>disconnected</span>
    <span id="playerBadge" class="player-badge" style="display:none"></span>

    <div class="conn-form">
      <label for="serverUrl">Server</label>
      <input id="serverUrl" value="ws://localhost:8000" />
      <label for="gameId">Table</label>
      <input id="gameId" value="demo" />
      <button class="btn primary" id="connectBtn">Connect</button>
      <button class="btn danger" id="disconnectBtn" style="display:none">Disconnect</button>
    </div>
  </header>

  <div id="app" style="display:none">

    <div class="table">
      <div class="seats" id="seats"></div>

      <div class="turn-banner" id="turnBanner"></div>

      <div class="centerpiece">
        <div class="rank-emblem" id="rankEmblem">—</div>
        <div class="claim-block">
          <div class="claim-headline" id="claimHeadline">Awaiting a declare</div>
          <div class="claim-sub" id="claimSub"></div>
        </div>
        <div class="pile">
          <div class="pile-stack" id="pileStack"></div>
          <div class="pile-label" id="pileLabel">Pile: 0</div>
        </div>
      </div>
    </div>

    <div class="hand-panel">
      <h2>Your hand</h2>
      <div class="hand-row" id="handRow"></div>
    </div>

    <div class="dock" id="dock"></div>

    <details class="debug">
      <summary>Table management &amp; debug</summary>
      <div class="debug-body">
        <div class="row">
          <span class="label">Add bot</span>
          <select id="botSeat">
            <option value="0">Seat 0</option>
            <option value="1">Seat 1</option>
            <option value="2">Seat 2</option>
          </select>
          <input id="botAgent" value="random" style="width:110px" />
          <button class="btn" id="addBotBtn">Add bot</button>
        </div>
        <div class="row">
          <button class="btn" id="whoAmIBtn">Who am I?</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </details>

  </div>

</div>

<script src = "script.js"></script>

</body>
</html>

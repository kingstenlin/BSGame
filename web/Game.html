<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS — Card Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #222228;
    --surface3: #2a2a32;
    --border: rgba(255,255,255,0.08);
    --border-bright: rgba(255,255,255,0.18);
    --text: #e8e8ec;
    --muted: #7a7a8a;
    --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.12);
    --accent2: #7b8cde;
    --red: #e05555;
    --green: #5cba7d;
    --green-dim: rgba(92,186,125,0.12);
    --red-dim: rgba(224,85,85,0.12);
    --radius: 10px;
    --radius-lg: 16px;
    --font: 'Georgia', 'Times New Roman', serif;
    --mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }

  /* ── screens ── */
  .screen { display: none; min-height: 100vh; padding: 2rem 1rem; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #game-screen.active { display: grid; grid-template-rows: auto 1fr auto; align-items: start; justify-content: stretch; padding: 0; }

  /* ── landing ── */
  .brand { font-size: 6rem; font-weight: 700; letter-spacing: -4px; color: var(--accent); line-height: 1; margin-bottom: .25rem; }
  .brand-sub { font-size: 1rem; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 3rem; }
  .card-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 420px; }
  .card-panel h2 { font-size: 1.1rem; color: var(--muted); margin-bottom: 1.5rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 400; }

  label { display: block; font-size: .8rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: .4rem; }
  input, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: .95rem; padding: .65rem .9rem; margin-bottom: 1.2rem; outline: none; transition: border-color .15s; }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button { display: none; }

  .btn { display: block; width: 100%; padding: .75rem; border-radius: var(--radius); border: 1px solid var(--border-bright); background: transparent; color: var(--text); font-family: var(--font); font-size: 1rem; cursor: pointer; transition: background .15s, border-color .15s; letter-spacing: .5px; }
  .btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #1a1200; font-weight: 700; }
  .btn-primary:hover { background: #d4b87a; border-color: #d4b87a; color: #1a1200; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red-dim); }
  .btn-sm { font-size: .8rem; padding: .45rem .8rem; width: auto; display: inline-block; }

  .divider { text-align: center; color: var(--muted); font-size: .8rem; margin: 1.2rem 0; letter-spacing: 2px; }

  .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  .tab { flex: 1; padding: .5rem; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font); cursor: pointer; font-size: .85rem; transition: all .15s; }
  .tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .error-msg { color: var(--red); font-size: .85rem; margin-top: .5rem; min-height: 1.2em; }

  /* ── bot builder ── */
  .bot-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
  .bot-row select { margin-bottom: 0; flex: 1; }
  .bot-remove { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: .35rem .6rem; cursor: pointer; font-size: .85rem; line-height: 1; }
  .bot-remove:hover { border-color: var(--red); color: var(--red); }
  #bot-list { margin-bottom: .75rem; }

  /* ── lobby screen ── */
  .lobby-room-id { font-size: 3rem; font-family: var(--mono); letter-spacing: 8px; color: var(--accent); margin: 1rem 0; }
  .lobby-seats { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }
  .seat-list { display: flex; flex-direction: column; gap: .5rem; width: 100%; max-width: 360px; margin-bottom: 1.5rem; }
  .seat-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem 1rem; display: flex; align-items: center; gap: .75rem; font-size: .9rem; }
  .seat-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: .7rem; color: var(--muted); flex-shrink: 0; }
  .seat-avatar.filled { background: var(--accent-dim); color: var(--accent); }
  .seat-avatar.bot { background: var(--surface3); color: var(--accent2); }
  .badge { font-size: .65rem; padding: .2rem .5rem; border-radius: 20px; letter-spacing: .5px; text-transform: uppercase; }
  .badge-you { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }
  .badge-bot { background: rgba(123,140,222,0.12); color: var(--accent2); border: 1px solid var(--accent2); }
  .badge-waiting { background: var(--surface3); color: var(--muted); border: 1px solid var(--border); }
  .waiting-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border-bright); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── game screen ── */
  #game-screen { background: var(--bg); }
  .game-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .game-header-left { display: flex; align-items: baseline; gap: 1rem; }
  .game-title { font-size: 1.4rem; color: var(--accent); font-weight: 700; letter-spacing: -1px; }
  .room-code { font-family: var(--mono); font-size: .8rem; color: var(--muted); letter-spacing: 3px; }
  .game-body { display: grid; grid-template-columns: 220px 1fr 280px; gap: 0; height: calc(100vh - 53px - 260px); min-height: 300px; }
  .sidebar { padding: 1rem; border-right: 1px solid var(--border); overflow-y: auto; }
  .sidebar-right { padding: 1rem; border-left: 1px solid var(--border); overflow-y: auto; }
  .game-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; gap: 1.25rem; }
  .game-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 1rem 1.5rem; min-height: 260px; }

  /* players sidebar */
  .sidebar-title { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: .75rem; }
  .player-row { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: var(--radius); margin-bottom: .25rem; transition: background .15s; }
  .player-row.active-turn { background: var(--accent-dim); border: 1px solid rgba(200,169,110,0.25); }
  .player-row.is-me { background: var(--green-dim); }
  .player-row.is-me.active-turn { background: var(--accent-dim); }
  .p-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: .65rem; flex-shrink: 0; color: var(--muted); }
  .p-avatar.me { background: rgba(92,186,125,0.2); color: var(--green); }
  .p-avatar.bot-av { background: rgba(123,140,222,0.15); color: var(--accent2); }
  .p-info { flex: 1; min-width: 0; }
  .p-name { font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-name.me-name { color: var(--green); }
  .p-cards { font-size: .7rem; color: var(--muted); font-family: var(--mono); }
  .p-turn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* center pile */
  .pile-display { text-align: center; }
  .pile-count { font-size: 4rem; color: var(--accent); font-weight: 700; line-height: 1; }
  .pile-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-top: .25rem; }
  .phase-badge { padding: .35rem 1rem; border-radius: 20px; font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; }
  .phase-declare { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }
  .phase-challenge { background: var(--red-dim); color: var(--red); border: 1px solid rgba(224,85,85,0.3); }
  .claim-display { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem 1.2rem; font-size: .9rem; color: var(--muted); text-align: center; }
  .claim-display strong { color: var(--text); }
  .waiting-msg { color: var(--muted); font-size: .85rem; font-style: italic; display: flex; align-items: center; gap: .5rem; }

  /* hand section */
  .hand-section { }
  .hand-title { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: .75rem; }
  .hand-cards { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .card { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; height: 72px; background: #fafaf8; border-radius: 6px; border: 1px solid #ddd; color: #1a1a1a; font-size: 1rem; font-weight: 700; cursor: default; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .card-rank { font-size: 1.1rem; line-height: 1; }
  .card-count { position: absolute; bottom: 3px; right: 4px; font-size: .55rem; background: rgba(0,0,0,0.12); border-radius: 3px; padding: 1px 3px; color: #444; }
  .rank-to-play { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem 1rem; font-size: .9rem; }
  .rank-to-play span { color: var(--accent); font-weight: 700; }

  /* action buttons */
  .actions-section { }
  .actions-title { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: .75rem; }
  .actions-grid { display: flex; flex-direction: column; gap: .4rem; max-height: 180px; overflow-y: auto; padding-right: 2px; }
  .action-btn { display: flex; align-items: flex-start; gap: .75rem; padding: .55rem .8rem; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all .15s; text-align: left; width: 100%; color: var(--text); font-family: var(--font); }
  .action-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
  .action-btn.challenge-btn:hover { border-color: var(--red); background: var(--red-dim); }
  .action-btn.pass-btn:hover { border-color: var(--accent2); background: rgba(123,140,222,0.1); }
  .action-id { font-family: var(--mono); font-size: .7rem; color: var(--muted); min-width: 22px; padding-top: 2px; }
  .action-text { font-size: .8rem; line-height: 1.4; }
  .action-text .long { display: block; color: var(--muted); font-size: .72rem; margin-top: 2px; }

  /* log */
  .log-title { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: .6rem; }
  .log-entries { display: flex; flex-direction: column-reverse; gap: .3rem; max-height: 280px; overflow-y: auto; }
  .log-entry { font-size: .75rem; color: var(--muted); padding: .3rem .5rem; border-radius: 5px; background: var(--surface2); line-height: 1.4; }
  .log-entry .actor { color: var(--text); font-weight: 600; }
  .log-entry.event-challenge { background: var(--red-dim); }
  .log-entry.event-pass { background: rgba(123,140,222,0.08); }
  .log-entry.event-system { background: transparent; color: var(--muted); font-style: italic; }

  /* game-over overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .overlay-card { background: var(--surface); border: 1px solid var(--border-bright); border-radius: var(--radius-lg); padding: 2.5rem; text-align: center; max-width: 380px; width: 90%; }
  .overlay-card h2 { font-size: 2.5rem; color: var(--accent); margin-bottom: .5rem; }
  .overlay-card p { color: var(--muted); margin-bottom: 1.5rem; font-size: .9rem; }
  .rewards-list { text-align: left; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: .4rem; }
  .reward-row { display: flex; justify-content: space-between; font-size: .85rem; padding: .4rem .6rem; border-radius: 6px; background: var(--surface2); }
  .reward-row.winner { background: var(--accent-dim); color: var(--accent); }
  .reward-row .r-score { font-family: var(--mono); }

  /* responsive */
  @media (max-width: 700px) {
    .game-body { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    .sidebar-right { border-left: none; border-top: 1px solid var(--border); }
    .game-center { min-height: 200px; }
    .brand { font-size: 4rem; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════ LANDING ═══════════════════════════ -->
<div id="landing-screen" class="screen active">
  <div style="text-align:center">
    <div class="brand">BS</div>
    <div class="brand-sub">The Bluffing Card Game</div>
  </div>

  <div class="card-panel">
    <div class="tabs">
      <button class="tab active" id="tab-create" onclick="switchTab('create')">Create Room</button>
      <button class="tab" id="tab-join" onclick="switchTab('join')">Join Room</button>
    </div>

    <!-- CREATE -->
    <div id="create-panel">
      <label>Your name</label>
      <input id="create-name" type="text" placeholder="Enter your name" maxlength="20">

      <label>Total players</label>
      <select id="create-players">
        <option value="2">2 players</option>
        <option value="3">3 players</option>
        <option value="4" selected>4 players</option>
        <option value="5">5 players</option>
        <option value="6">6 players</option>
      </select>

      <label>Bot opponents</label>
      <div id="bot-list"></div>
      <button class="btn btn-sm" style="margin-bottom:1.2rem" onclick="addBot()">+ Add Bot</button>

      <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
      <div class="error-msg" id="create-error"></div>
    </div>

    <!-- JOIN -->
    <div id="join-panel" style="display:none">
      <label>Your name</label>
      <input id="join-name" type="text" placeholder="Enter your name" maxlength="20">
      <label>Room code</label>
      <input id="join-code" type="text" placeholder="e.g. AB12CD" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-family:monospace;font-size:1.2rem">
      <button class="btn btn-primary" onclick="joinRoom()">Join Room</button>
      <div class="error-msg" id="join-error"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════ LOBBY ═══════════════════════════ -->
<div id="lobby-screen" class="screen">
  <div style="text-align:center;margin-bottom:1rem">
    <div style="font-size:1rem;color:var(--muted);letter-spacing:3px;text-transform:uppercase">Room Code</div>
    <div class="lobby-room-id" id="lobby-room-id">------</div>
    <div class="lobby-seats" id="lobby-seats">Waiting for players...</div>
  </div>
  <div class="seat-list" id="seat-list"></div>
  <div class="waiting-spinner" id="lobby-spinner"></div>
</div>

<!-- ═══════════════════════════ GAME ═══════════════════════════ -->
<div id="game-screen" class="screen">

  <div class="game-header">
    <div class="game-header-left">
      <span class="game-title">BS</span>
      <span class="room-code" id="hdr-room-code"></span>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem">
      <span style="font-size:.8rem;color:var(--muted)" id="hdr-you"></span>
    </div>
  </div>

  <div class="game-body">

    <!-- left: players -->
    <div class="sidebar">
      <div class="sidebar-title">Players</div>
      <div id="players-list"></div>
    </div>

    <!-- center: pile + state -->
    <div class="game-center">
      <div class="pile-display">
        <div class="pile-count" id="pile-count">—</div>
        <div class="pile-label">Cards in pile</div>
      </div>
      <div id="phase-badge" class="phase-badge phase-declare" style="display:none">Declare</div>
      <div id="claim-display" class="claim-display" style="display:none"></div>
      <div class="waiting-msg" id="waiting-msg" style="display:none">
        <div class="waiting-spinner"></div>
        <span id="waiting-text">Waiting...</span>
      </div>
    </div>

    <!-- right: log -->
    <div class="sidebar-right">
      <div class="log-title">Activity</div>
      <div class="log-entries" id="log-entries"></div>
    </div>

  </div>

  <!-- footer: hand + actions -->
  <div class="game-footer">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;height:100%">

      <div class="hand-section">
        <div class="hand-title">Your hand</div>
        <div class="hand-cards" id="hand-cards"></div>
        <div id="rank-to-play" style="display:none" class="rank-to-play">Play as: <span id="rtp-rank"></span></div>
      </div>

      <div class="actions-section">
        <div class="actions-title" id="actions-title">Actions</div>
        <div class="actions-grid" id="actions-grid">
          <div style="color:var(--muted);font-size:.8rem;font-style:italic">Not your turn</div>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- game over overlay (hidden) -->
<div class="overlay" id="gameover-overlay" style="display:none">
  <div class="overlay-card">
    <h2 id="go-title">Game Over</h2>
    <p id="go-subtitle"></p>
    <div class="rewards-list" id="go-rewards"></div>
    <button class="btn btn-primary" onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
// ── state ──────────────────────────────────────────────────────────────────
const socket = io();
let myAgent = null;
let myName = '';
let myRoom = null;
let isMyTurn = false;
let currentPhase = null;
let currentState = null;
let pendingBots = [];

// ── tab switching ──────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('create-panel').style.display = tab === 'create' ? '' : 'none';
  document.getElementById('join-panel').style.display   = tab === 'join'   ? '' : 'none';
  document.getElementById('tab-create').classList.toggle('active', tab === 'create');
  document.getElementById('tab-join').classList.toggle('active',   tab === 'join');
}

// ── bot builder ────────────────────────────────────────────────────────────
const BOT_TYPES = ['random','honest','aggressive','conservative'];

function addBot() {
  const totalPlayers = parseInt(document.getElementById('create-players').value);
  if (pendingBots.length >= totalPlayers - 1) {
    document.getElementById('create-error').textContent = 'Need at least one human.';
    return;
  }
  document.getElementById('create-error').textContent = '';
  pendingBots.push('random');
  renderBotList();
}

function removeBot(idx) {
  pendingBots.splice(idx, 1);
  renderBotList();
}

function renderBotList() {
  const list = document.getElementById('bot-list');
  list.innerHTML = '';
  pendingBots.forEach((type, i) => {
    const row = document.createElement('div');
    row.className = 'bot-row';
    row.innerHTML = `
      <select onchange="pendingBots[${i}]=this.value">
        ${BOT_TYPES.map(t => `<option value="${t}" ${t===type?'selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
      </select>
      <button class="bot-remove" onclick="removeBot(${i})">✕</button>
    `;
    list.appendChild(row);
  });
}

// ── create / join ──────────────────────────────────────────────────────────
function createRoom() {
  const name = document.getElementById('create-name').value.trim();
  const numPlayers = parseInt(document.getElementById('create-players').value);
  if (!name) { document.getElementById('create-error').textContent = 'Enter your name.'; return; }
  myName = name;
  document.getElementById('create-error').textContent = '';
  socket.emit('create_room', { num_players: numPlayers, bots: [...pendingBots] });
}

function joinRoom() {
  const name = document.getElementById('join-name').value.trim();
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  if (!name) { document.getElementById('join-error').textContent = 'Enter your name.'; return; }
  if (!code)  { document.getElementById('join-error').textContent = 'Enter a room code.'; return; }
  myName = name;
  document.getElementById('join-error').textContent = '';
  socket.emit('join_room', { room_id: code, name });
}

// ── screens ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── socket handlers ────────────────────────────────────────────────────────

socket.on('error', data => {
  const ce = document.getElementById('create-error');
  const je = document.getElementById('join-error');
  if (document.getElementById('landing-screen').classList.contains('active')) {
    (document.getElementById('create-panel').style.display !== 'none' ? ce : je).textContent = data.msg;
  }
  addLog('⚠ ' + data.msg, 'event-system');
});

socket.on('room_created', data => {
  myRoom = data.room_id;
  // immediately join after creating
  socket.emit('join_room', { room_id: data.room_id, name: myName });
});

socket.on('joined', data => {
  myAgent = data.agent;
  myRoom  = data.room_id;
  document.getElementById('lobby-room-id').textContent = data.room_id;
  document.getElementById('hdr-room-code').textContent = data.room_id;
  document.getElementById('hdr-you').textContent = `You: ${data.name}`;
  showScreen('lobby-screen');
});

socket.on('lobby_update', data => {
  document.getElementById('lobby-seats').textContent =
    `${data.seats_taken} / ${data.seats_total} human seat(s) filled`;

  const list = document.getElementById('seat-list');
  list.innerHTML = '';

  // show connected humans
  (data.players || []).forEach(p => {
    const isMe = p.agent === myAgent;
    const item = document.createElement('div');
    item.className = 'seat-item';
    item.innerHTML = `
      <div class="seat-avatar filled">${p.name.substring(0,2).toUpperCase()}</div>
      <span style="flex:1;font-size:.9rem">${p.name}</span>
      ${isMe ? '<span class="badge badge-you">You</span>' : ''}
    `;
    list.appendChild(item);
  });

  // waiting slots
  for (let i = 0; i < data.waiting_for; i++) {
    const item = document.createElement('div');
    item.className = 'seat-item';
    item.innerHTML = `
      <div class="seat-avatar"><div class="waiting-spinner" style="width:14px;height:14px"></div></div>
      <span style="flex:1;font-size:.85rem;color:var(--muted);font-style:italic">Waiting...</span>
      <span class="badge badge-waiting">Open</span>
    `;
    list.appendChild(item);
  }
});

socket.on('game_started', data => {
  showScreen('game-screen');
  renderPlayers(data.players);
  addLog('Game started!', 'event-system');
});

socket.on('table_update', data => {
  renderPlayers(data.players);
});

socket.on('your_turn', state => {
  isMyTurn = true;
  currentState = state;
  currentPhase = state.phase;

  // pile
  document.getElementById('pile-count').textContent = state.pile_size;

  // phase badge
  const pb = document.getElementById('phase-badge');
  pb.style.display = '';
  pb.className = 'phase-badge ' + (state.phase === 'CHALLENGE' ? 'phase-challenge' : 'phase-declare');
  pb.textContent = state.phase;

  // claim
  const cd = document.getElementById('claim-display');
  if (state.previous_claim) {
    cd.style.display = '';
    cd.innerHTML = `Previous claim: <strong>${state.previous_claim.count}× ${state.previous_claim.rank}</strong>`;
  } else {
    cd.style.display = 'none';
  }

  // waiting msg off
  document.getElementById('waiting-msg').style.display = 'none';

  // hand
  renderHand(state.hand);

  // rank to play
  const rtp = document.getElementById('rank-to-play');
  if (state.rank_to_play) {
    rtp.style.display = '';
    document.getElementById('rtp-rank').textContent = state.rank_to_play;
  } else {
    rtp.style.display = 'none';
  }

  // actions
  renderActions(state.available_actions, state.phase);

  document.getElementById('actions-title').textContent = '↓ Choose your action';
});

socket.on('waiting_for', data => {
  const isMe = data.agent === myAgent;
  if (!isMe) {
    isMyTurn = false;
    const wm = document.getElementById('waiting-msg');
    wm.style.display = 'flex';
    document.getElementById('waiting-text').textContent = `Waiting for ${data.name}...`;
    document.getElementById('actions-grid').innerHTML =
      '<div style="color:var(--muted);font-size:.8rem;font-style:italic">Not your turn</div>';
    document.getElementById('actions-title').textContent = 'Actions';
  }
});

socket.on('hand_update', data => {
  renderHand(data.hand);
  document.getElementById('pile-count').textContent = data.pile_size;
});

socket.on('bot_action', data => {
  const label = data.action === 14 ? 'challenge-btn' : data.action === 15 ? 'pass-btn' : '';
  const evClass = data.action === 14 ? 'event-challenge' : data.action === 15 ? 'event-pass' : '';
  addLog(`<span class="actor">${data.name}</span> → ${data.action_long}`, evClass);
  // update pile display if visible
});

socket.on('player_left', data => {
  addLog(`${data.name} disconnected. Game ended.`, 'event-system');
  document.getElementById('gameover-overlay').style.display = 'flex';
  document.getElementById('go-title').textContent = 'Disconnected';
  document.getElementById('go-subtitle').textContent = `${data.name} left the game.`;
  document.getElementById('go-rewards').innerHTML = '';
});

socket.on('game_over', data => {
  const isWinner = data.winner === myAgent;
  document.getElementById('go-title').textContent = isWinner ? '🏆 You Win!' : 'Game Over';
  document.getElementById('go-subtitle').textContent =
    isWinner ? 'Congratulations!' : `${data.winner_name} wins this round.`;

  const rewardsList = document.getElementById('go-rewards');
  rewardsList.innerHTML = '';
  const names = data.names || {};
  Object.entries(data.rewards).sort((a,b) => b[1]-a[1]).forEach(([agent, reward]) => {
    const name = names[agent] || agent;
    const isW  = agent === data.winner;
    const row  = document.createElement('div');
    row.className = 'reward-row' + (isW ? ' winner' : '');
    row.innerHTML = `<span>${name}</span><span class="r-score">${reward > 0 ? '+' : ''}${reward.toFixed(0)}</span>`;
    rewardsList.appendChild(row);
  });

  document.getElementById('gameover-overlay').style.display = 'flex';
  addLog(`Game over! Winner: ${data.winner_name}`, 'event-system');
});

// ── render helpers ─────────────────────────────────────────────────────────

function renderPlayers(players) {
  const container = document.getElementById('players-list');
  const currentActive = document.querySelector('.player-row.active-turn');
  const activeAgent = currentActive ? currentActive.dataset.agent : null;

  container.innerHTML = '';
  players.forEach(p => {
    const isMe = p.agent === myAgent;
    const isActive = p.agent === activeAgent ||
      (isMyTurn && currentState && p.agent === currentState.agent);

    const row = document.createElement('div');
    row.className = 'player-row' + (isActive ? ' active-turn' : '') + (isMe ? ' is-me' : '');
    row.dataset.agent = p.agent;

    let avatarClass = isMe ? 'me' : (p.is_bot ? 'bot-av' : '');
    let initials = p.name.substring(0,2).toUpperCase();
    let nameMeta = p.is_bot ? `<span class="badge badge-bot" style="font-size:.55rem">${p.bot_type}</span>` : '';

    row.innerHTML = `
      <div class="p-avatar ${avatarClass}">${initials}</div>
      <div class="p-info">
        <div class="p-name ${isMe ? 'me-name' : ''}">${p.name} ${nameMeta}</div>
        <div class="p-cards">${p.hand_size} card${p.hand_size !== 1 ? 's' : ''}</div>
      </div>
      ${isActive ? '<div class="p-turn-dot"></div>' : ''}
    `;
    container.appendChild(row);
  });
}

function renderHand(hand) {
  const container = document.getElementById('hand-cards');
  container.innerHTML = '';
  const SUITS = ['♠','♥','♦','♣'];
  Object.entries(hand).sort().forEach(([rank, count]) => {
    const card = document.createElement('div');
    card.className = 'card';
    const suitIdx = ['A','2','3','4','5','6','7','8','9','T','J','Q','K'].indexOf(rank) % 4;
    const suitColor = (suitIdx === 1 || suitIdx === 2) ? '#c0392b' : '#1a1a1a';
    card.style.color = suitColor;
    card.innerHTML = `
      <span class="card-rank">${rank}${SUITS[suitIdx]}</span>
      ${count > 1 ? `<span class="card-count">×${count}</span>` : ''}
    `;
    container.appendChild(card);
  });
  if (Object.keys(hand).length === 0) {
    container.innerHTML = '<span style="color:var(--green);font-size:.85rem">No cards — you might win!</span>';
  }
}

function renderActions(actions, phase) {
  const grid = document.getElementById('actions-grid');
  grid.innerHTML = '';

  Object.entries(actions).sort((a,b) => parseInt(a[0]) - parseInt(b[0])).forEach(([id, info]) => {
    const iid = parseInt(id);
    const btn = document.createElement('button');
    let extraClass = iid === 14 ? 'challenge-btn' : iid === 15 ? 'pass-btn' : '';
    btn.className = `action-btn ${extraClass}`;
    btn.innerHTML = `
      <span class="action-id">${iid}</span>
      <span class="action-text">
        ${info.short}
        <span class="long">${info.long}</span>
      </span>
    `;
    btn.onclick = () => submitAction(iid);
    grid.appendChild(btn);
  });
}

function submitAction(actionId) {
  if (!isMyTurn) return;
  socket.emit('submit_action', { room_id: myRoom, action: actionId });
  isMyTurn = false;

  // optimistic UI
  const actTitle = document.getElementById('actions-title');
  actTitle.textContent = 'Action submitted...';
  document.getElementById('actions-grid').innerHTML =
    '<div style="color:var(--muted);font-size:.8rem;font-style:italic">Waiting for response...</div>';

  if (currentState) {
    const desc = currentState.available_actions[String(actionId)];
    if (desc) addLog(`<span class="actor">${myName}</span> → ${desc.long}`,
      actionId === 14 ? 'event-challenge' : actionId === 15 ? 'event-pass' : '');
  }
}

function addLog(html, extraClass = '') {
  const container = document.getElementById('log-entries');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + extraClass;
  entry.innerHTML = html;
  container.prepend(entry);
  // cap log at 60 entries
  while (container.children.length > 60) container.removeChild(container.lastChild);
}

// enter key shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('create-name') === document.activeElement) createRoom();
    if (document.getElementById('join-code') === document.activeElement)  joinRoom();
    if (document.getElementById('join-name') === document.activeElement)  joinRoom();
  }
});
</script>
